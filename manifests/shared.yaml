    tags: &id002
    - jump
  jump_air:
    loop: false
    tags: *id002
    notes: Record a full jump; trim to the airborne section in Review.
  jump_land:
    loop: false
    tags: *id002
  hit_light:
    loop: false
    tags: &id003
    - reaction
    root_motion: in_place
  hit_heavy:
    loop: false
    tags: *id003
    root_motion: in_place
  hit_back:
    loop: false
    tags: *id003
    root_motion: in_place
  knockdown_getup:
    loop: false
    tags: &id004
    - reaction
  death_a:
    loop: false
