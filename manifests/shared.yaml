# Shared moves - merged into every game
# Fields: loop (bool), root_motion (extract|in_place, default from game config),
# tags (list), notes (shown on the phone), hits (impact events -> hit_frame), foot_lock (bool)
game: null
moves:
  idle_loop:
    loop: true
    tags:
    - idle
    root_motion: in_place
    notes: Relaxed weight shifts, 6-8 s.
  walk_loop:
    loop: true
    tags: &id001
    - locomotion
  run_loop:
    loop: true
    tags: *id001
  turn_180:
